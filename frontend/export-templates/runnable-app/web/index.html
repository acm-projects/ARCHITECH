<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<!-- Where the app's API lives: empty in the Docker app (same server); filled in by ARCHITECH when
     the design runs inside it. -->
<meta name="app-base" content="">
<link rel="icon" href="/archie.svg">
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #14283f; --muted: #526b84; --line: #d5e3f0; --soft: #edf6ff;
    color-scheme: light;
    --archie: #0096ff; --archie-soft: #e0f1ff;
    --accent: #006bc7; --accent-soft: #e8f4ff; --done: #15803d; --done-soft: #dcf2e3;
    --fail: #b91c1c; --fail-soft: #fbe2e2; --warn: #a16207; --warn-soft: #fbf0d0;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 6px 24px rgba(0, 0, 0, .12);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border-radius: 10px; box-shadow: 0 2px 4px rgba(20, 73, 118, .12); border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:not(:disabled):hover { background: var(--soft); border-color: var(--accent); }
  button.primary:not(:disabled):hover { background: #005aa8; color: #fff; }
  button:not(:disabled):active { box-shadow: inset 0 1px 2px rgba(0, 67, 125, .2); }
  button.destructive { color: var(--fail); border-color: #efb4b4; box-shadow: none; }
  button.destructive:not(:disabled):hover { background: var(--fail-soft); border-color: var(--fail); }
  button.link { border: 0; background: none; padding: 0; color: var(--archie); text-decoration: underline; text-underline-offset: 2px; }
  button.link, button.archie-face { box-shadow: none; }
  button:disabled { box-shadow: none; opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  textarea { resize: vertical; min-height: 70px; }
  label { font-size: 13px; color: var(--muted); }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .who { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }

  /* Split screen: Archie's demo on the left, the app on the right. One page, one port. */
  body { height: 100dvh; overflow: hidden; }
  .split { display: grid; grid-template-columns: minmax(0, var(--split-size, 46%)) 8px minmax(0, 1fr); height: 100dvh; }
  .split > * { min-width: 0; }
  .pane-divider { cursor: col-resize; touch-action: none; background: var(--panel); border-inline: 1px solid var(--line); position: relative; }
  .pane-divider::after { content: ""; position: absolute; inset: 45% 2px; border-radius: 2px; background: #9dbbd6; }
  .pane-divider:hover, .pane-divider:focus-visible, .pane-divider.dragging { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  .demo { display: flex; flex-direction: column; gap: 12px; padding: 16px; min-height: 0; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  .app-pane { min-height: 0; overflow-y: auto; }
  .demo-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .demo-head h2 { font-size: 16px; margin: 0; white-space: nowrap; }
  .map-now { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-now b { color: var(--archie); }
  .stage { flex: 0 0 auto; height: clamp(220px, 44dvh, 520px); border: 1px solid var(--line); border-radius: 12px; background-color: #fff; background-image: radial-gradient(circle, #c7ddf0 .8px, transparent .9px), radial-gradient(ellipse at 100% 0%, #e4f3ff, transparent 72%); background-size: 20px 20px, 100% 100%; background-position: 10px 10px, 0 0; }
  .stage { position: relative; overflow: hidden; }
  .diagram-viewport { width: 100%; height: 100%; overflow: auto; }
  .diagram-viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .canvas-tools { position: absolute; bottom: 8px; left: 8px; display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .canvas-tools button { padding: 3px 8px; box-shadow: none; border-radius: 6px; }
  .canvas-tools output { min-width: 42px; text-align: center; font: 12px var(--mono); }
  .diagram-viewport > svg { display: block; width: 100%; height: 100%; }
  .what { border-top: 1px solid var(--line); padding-top: 10px; }
  .what summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .what[open] summary { margin-bottom: 8px; }
  .what .stack { gap: 10px; }
  @media (max-width: 900px) {
    .split { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .pane-divider { display: none; }
    .demo { max-height: 50dvh; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; gap: 8px; }
    .stage { height: 150px; }
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .stack { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button[aria-selected="true"] { background: var(--soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .error { color: var(--fail); margin: 0; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .item h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  .item p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .badge.queued { background: var(--warn-soft); color: var(--warn); }
  .badge.processed { background: var(--done-soft); color: var(--done); }
  .meta { font-size: 12px; color: var(--muted); }
  .node-inspector { border-block: 1px solid var(--line); padding: 10px 0; }
  .node-inspector h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .node-inspector .row { justify-content: space-between; flex-wrap: nowrap; }
  .node-inspector button { box-shadow: none; padding: 3px 8px; }
  .inspection-fields, .request-fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; font-size: 13px; }
  .inspection-fields dt, .request-fields dt { color: var(--muted); }
  .inspection-fields dd, .request-fields dd { margin: 0; overflow-wrap: anywhere; }
  .request-summary { padding: 8px 10px; border-left: 2px solid var(--accent); background: var(--soft); }
  .request-summary p { margin: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .request-fields { font-family: var(--mono); font-size: 12px; }
  .request-fields [data-state="failed"] { color: var(--fail); }
  .edit-form { margin-bottom: 10px; }
  .edit-form .error:empty, #items-error:empty { display: none; }

  /* Diagram */
  .diagram .edge { stroke: #b1b1aa; stroke-width: 2; fill: none; transition: stroke .25s; }
  .diagram .edge.lit { stroke: var(--archie); stroke-width: 3; }
  .diagram .node .node-face { fill: var(--panel); stroke: #d3d3ce; stroke-width: 1; filter: drop-shadow(0 2px 4px rgba(17, 17, 17, .16)); transition: fill .25s, stroke .25s; }
  .diagram .node.added .node-face { stroke-dasharray: 5 4; }
  .diagram .node text { fill: var(--ink); font: 700 12px system-ui, sans-serif; }
  .diagram .node text.type { fill: var(--muted); font: 8px system-ui, sans-serif; }
  .diagram .node .icon-tile { fill-opacity: .12; stroke: none; }
  .diagram .node .handle { fill: #51514b; }
  .diagram .node.active .node-face { fill: var(--archie-soft); stroke: var(--archie); stroke-width: 2; }
  .diagram .node.done .node-face { fill: var(--done-soft); stroke: var(--done); }
  .diagram .node.fail .node-face { fill: var(--fail-soft); stroke: var(--fail); }
  .diagram .node.idle .node-face { stroke: #b4cde3; }
  .diagram .node.idle text { fill: var(--muted); }
  .diagram .node { cursor: pointer; }
  .diagram .node:focus { outline: none; }
  .diagram .node .selection-ring { display: none; fill: none; stroke: var(--ink); stroke-width: 1; }
  .diagram .node.selected .selection-ring, .diagram .node:focus-visible .selection-ring { display: block; }
  .diagram marker path { fill: #9dbbd6; }
  .diagram marker.lit path { fill: var(--archie); }

  /* What happened */
  .steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; overflow-y: auto; }
  .steps li.current { font-weight: 600; }
  .steps .fail { color: var(--fail); }
  .steps code { font-family: var(--mono); font-size: 12px; }

  /* Archie, beside the diagram */
  .archie { display: flex; align-items: flex-start; gap: 10px; }
  .archie-face { width: 64px; height: 52px; flex-shrink: 0; border: 0; padding: 0; background: none; cursor: pointer; margin-top: 4px; }
  .archie-face img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .2)); }
  .archie-face.talking img { animation: bob .6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  .bubble { position: relative; flex: 1; min-width: 0; min-height: 76px; background: var(--archie-soft); border: 1px solid #8abce5; border-radius: 16px; padding: 12px 14px; font-size: 14px; }
  .bubble::after { content: ""; position: absolute; left: -9px; top: 18px; border: 8px solid transparent; border-right-color: var(--archie); border-left: 0; }
  .bubble p { margin: 0; }
  .bubble .who-says { display: block; font-size: 12px; font-weight: 700; color: var(--archie); margin-bottom: 2px; }
  .bubble .controls { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; }
  .archie-off { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="split" id="split">
  <!-- Left: Archie shows what each part of your design does -->
  <aside class="demo" id="demo-pane" aria-label="How it works">
    <div class="demo-head">
      <h2>How it works</h2>
      <span class="map-now" id="map-now"></span>
    </div>
    <div class="stage"><div class="diagram-viewport" id="diagram-viewport" tabindex="0" role="region" aria-label="Architecture canvas. Scroll to pan when zoomed."><svg class="diagram" id="big-svg" role="group" aria-label="Architecture components and request path"></svg></div><div class="canvas-tools" role="group" aria-label="Canvas zoom"><button id="zoom-out" aria-label="Zoom out" disabled>&minus;</button><output id="zoom-level" aria-live="polite">100%</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-fit">Fit</button></div></div>
    <section class="node-inspector" id="node-inspector" aria-label="Component inspection" hidden>
      <div class="row"><h3 id="node-name"></h3><button id="node-close" aria-label="Close component inspection">Close</button></div>
      <dl class="inspection-fields">
        <dt>Type</dt><dd id="node-type"></dd>
        <dt>Technology</dt><dd id="node-technology"></dd>
        <dt>Latest request</dt><dd id="node-request"></dd>
        <dt>State</dt><dd id="node-state" aria-live="polite"></dd>
        <dt>Last step</dt><dd id="node-detail"></dd>
      </dl>
    </section>
    <div class="archie" id="archie">
      <button class="archie-face" id="face" aria-label="Archie: show or hide explanations"><img src="/archie.svg" alt=""></button>
      <div class="bubble" id="bubble" aria-live="polite">
        <span class="who-says">Archie</span>
        <p id="say"></p>
        <div class="controls">
          <button class="link" id="skip" hidden>Skip</button>
          <button class="link" id="quiet">Hide</button>
        </div>
      </div>
      <p class="archie-off" id="archie-off" hidden>Archie is resting. Click him to turn explanations back on.</p>
    </div>
    <details class="what" id="what">
      <summary>What happened, step by step</summary>
      <div class="stack">
        <select id="history" aria-label="Pick a request" disabled><option>No requests yet</option></select>
        <div class="request-summary" id="request-summary" hidden>
          <p id="request-label"></p>
          <dl class="request-fields">
            <dt>Method</dt><dd id="request-method"></dd>
            <dt>Endpoint</dt><dd id="request-path"></dd>
            <dt>Status</dt><dd id="request-status"></dd>
            <dt>Duration</dt><dd id="request-duration"></dd>
          </dl>
        </div>
        <ol class="steps" id="steps"></ol>
        <div class="row"><button id="replay" disabled>Replay with Archie</button></div>
      </div>
    </details>
  </aside>
  <div class="pane-divider" id="pane-divider" role="separator" tabindex="0" aria-label="Resize architecture and app panes" aria-orientation="vertical" aria-controls="demo-pane app-pane" aria-valuemin="25" aria-valuemax="75" aria-valuenow="46"></div>

  <!-- Right: the app itself -->
  <div class="app-pane" id="app-pane">
<header>
  <h1 id="title">App</h1>
  <span class="who" id="who" hidden></span>
  <button id="signout" hidden>Sign out</button>
</header>

<main>
  <section class="card" id="auth" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-signin" aria-selected="true">Sign in</button>
      <button role="tab" id="tab-signup" aria-selected="false">Create account</button>
    </div>
    <form id="auth-form" class="stack">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required maxlength="254">
      <label for="password">Password (8+ characters)</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
      <button class="primary" id="auth-go" type="submit">Sign in</button>
      <p class="error" id="auth-error" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="card">
      <h2>New item</h2>
      <form id="new" class="stack">
        <label for="new-title">Title</label>
        <input id="new-title" required maxlength="200">
        <label for="new-body">Text</label>
        <textarea id="new-body" maxlength="10000"></textarea>
        <div id="new-file-row" class="stack" hidden>
          <label for="new-file">Attach a file (optional, up to 5 MB)</label>
          <input id="new-file" type="file">
        </div>
        <div class="row"><button class="primary" type="submit" id="new-go">Add</button></div>
        <p class="error" id="new-error" role="alert"></p>
      </form>
    </div>
    <div class="card">
      <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
        <h2 style="margin: 0;">Your items</h2>
        <button id="refresh">Refresh</button>
      </div>
      <form id="search" class="row" hidden style="margin-bottom: 12px;">
        <input id="q" type="search" placeholder="Search your items" aria-label="Search your items" style="flex: 1; width: auto;">
        <button type="submit">Search</button>
      </form>
      <ul class="items" id="items"></ul>
      <p class="error" id="items-error" role="alert"></p>
      <p class="note" id="empty" style="margin: 0;">Nothing yet. Add your first item above.</p>
    </div>
  </section>
</main>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const BASE = document.querySelector('meta[name="app-base"]')?.content ?? "";
  const html = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plain = (value) => String(value ?? "").replace(/<[^>]+>/g, "");
  let config, user = null, items = [], signup = false, page = null;
  const history = [];
  let playing = 0, fast = false, busy = false, pendingIntro = null;
  const waiting = [];
  const STEP_MS = 1800;
  let quiet = false;
  try { quiet = localStorage.getItem("archie-quiet") === "1"; } catch {}

  // ---- Talking to the app's API, collecting what each part of the design did ----
  async function api(method, path, { body, raw, headers = {}, label, quiet: background = false, then = false } = {}) {
    const started = performance.now();
    let response;
    try {
      response = await fetch(BASE + path, {
        method,
        headers: raw ? headers : body !== undefined ? { "Content-Type": "application/json", ...headers } : headers,
        body: raw ?? (body !== undefined ? JSON.stringify(body) : undefined),
      });
    } catch {
      record({ label: label ?? `${method} ${path}`, method, path, status: 0, durationMs: performance.now() - started, headers: new Headers(), steps: [] }, background, then);
      throw new Error("The app did not answer. Is docker compose still running?");
    }
    let steps = [];
    try { steps = JSON.parse(decodeURIComponent(response.headers.get("X-Trace-Steps") ?? "[]")); } catch { steps = []; }
    const data = response.headers.get("Content-Type")?.includes("json") ? await response.json().catch(() => ({})) : null;
    record({ label: label ?? `${method} ${path}`, method, path, status: response.status, durationMs: performance.now() - started, headers: response.headers, steps }, background, then);
    if (!response.ok) throw Object.assign(new Error(data?.error ?? `Request failed (${response.status}).`), { status: response.status });
    return data;
  }
  // then: the request follows another one from the same click (attaching a file after adding the item), so it plays after it.
  function record(trace, background, then = false) {
    trace.time = new Date();
    if (background) return;
    history.unshift(trace);
    history.length = Math.min(history.length, 25);
    renderHistory();
    play(trace, stepsFor(trace), { background: then });
  }

  // ---- The diagram (the canvas layout of the design) ----
  // Same 16px component glyphs and family colors as the workspace canvas.
  const nodeGlyphs = {"client": "<rect x=\"2\" y=\"3\" width=\"12\" height=\"8\" rx=\"1\" /> <path d=\"M8 11v2.5M5.5 13.5h5\" />", "web-app": "<rect x=\"1.5\" y=\"2.5\" width=\"13\" height=\"11\" rx=\"1.5\" /> <path d=\"M1.5 5.75h13M3.75 4.1h.01M5.75 4.1h.01\" />", "mobile-app": "<rect x=\"4.5\" y=\"1.5\" width=\"7\" height=\"13\" rx=\"1.5\" /> <path d=\"M7 12.25h2\" />", "cdn": "<circle cx=\"8\" cy=\"8\" r=\"6\" /> <ellipse cx=\"8\" cy=\"8\" rx=\"2.6\" ry=\"6\" /> <path d=\"M2 8h12\" />", "dns": "<circle cx=\"8\" cy=\"3.5\" r=\"1.5\" /> <circle cx=\"3.5\" cy=\"12\" r=\"1.5\" /> <circle cx=\"12.5\" cy=\"12\" r=\"1.5\" /> <path d=\"M8 5v2.5M8 7.5l-3.8 3.2M8 7.5l3.8 3.2\" />", "server": "<rect x=\"2\" y=\"2.5\" width=\"12\" height=\"4.5\" rx=\"1\" /> <rect x=\"2\" y=\"9\" width=\"12\" height=\"4.5\" rx=\"1\" /> <path d=\"M4.5 4.75h1M4.5 11.25h1\" />", "api-gateway": "<path d=\"M7 2v12M1.5 8h4M10 8h4.5M12.5 5.5L15 8l-2.5 2.5\" />", "custom": "<path d=\"M3 4.5h3a1.5 1.5 0 1 1 3 0h3v3a1.5 1.5 0 1 1 0 3v3H9a1.5 1.5 0 1 0-3 0H3v-3a1.5 1.5 0 1 0 0-3z\" />", "api": "<path d=\"M5.5 2.5c-1.4 0-2 .7-2 2V6c0 .9-.6 1.6-1.5 2 .9.4 1.5 1.1 1.5 2v1.5c0 1.3.6 2 2 2M10.5 2.5c1.4 0 2 .7 2 2V6c0 .9.6 1.6 1.5 2-.9.4-1.5 1.1-1.5 2v1.5c0 1.3-.6 2-2 2\" />", "load-balancer": "<path d=\"M2 8h4l5-4M6 8l5 4\" /> <circle cx=\"12.5\" cy=\"4\" r=\"1.5\" /> <circle cx=\"12.5\" cy=\"12\" r=\"1.5\" />", "database": "<ellipse cx=\"8\" cy=\"4\" rx=\"5\" ry=\"2\" /> <path d=\"M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2\" />", "cache": "<path d=\"M8 2l6 3-6 3-6-3z\" /> <path d=\"M2 8l6 3 6-3M2 11l6 3 6-3\" />", "queue": "<rect x=\"1.5\" y=\"5\" width=\"3.5\" height=\"6\" rx=\"0.75\" /> <rect x=\"6.25\" y=\"5\" width=\"3.5\" height=\"6\" rx=\"0.75\" /> <rect x=\"11\" y=\"5\" width=\"3.5\" height=\"6\" rx=\"0.75\" />", "worker": "<circle cx=\"8\" cy=\"8\" r=\"2.2\" /> <circle cx=\"8\" cy=\"8\" r=\"4.6\" /> <path d=\"M8 1.5v1.9M8 12.6v1.9M1.5 8h1.9M12.6 8h1.9M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3\" />", "object-storage": "<path d=\"M2 5l6-3 6 3v6l-6 3-6-3z\" /> <path d=\"M2 5l6 3 6-3M8 8v6\" />", "search": "<circle cx=\"7\" cy=\"7\" r=\"4.5\" /> <path d=\"M10.4 10.4L14 14\" />", "auth": "<circle cx=\"5\" cy=\"8\" r=\"2.8\" /> <path d=\"M7.8 8H14M11.5 8v2.5M14 8v1.5\" />"};
  const nodeTypes = { client: "Client", "web-app": "Web App", "mobile-app": "Mobile App", server: "API Server", "api-gateway": "API Gateway", api: "API", custom: "Custom", database: "Database", cache: "Cache", queue: "Message Queue", worker: "Worker", "object-storage": "Object Storage", search: "Search", auth: "Authentication", cdn: "CDN", dns: "DNS", "load-balancer": "Load Balancer" };
  function nodeFamily(type) {
    if (["client", "web-app", "mobile-app"].includes(type)) return "#4f7cff";
    if (["server", "worker", "api", "api-gateway", "auth"].includes(type)) return "#f05a72";
    if (["database", "cache", "queue", "object-storage", "search"].includes(type)) return "#45a66b";
    return "#38a7a5";
  }
  function roundedRoute(points) {
    let path = `M${points[0].x},${points[0].y}`;
    for (let i = 1; i < points.length - 1; i++) {
      const a = points[i - 1], b = points[i], c = points[i + 1];
      const incoming = Math.hypot(b.x - a.x, b.y - a.y);
      const outgoing = Math.hypot(c.x - b.x, c.y - b.y);
      if (!incoming || !outgoing) continue;
      const r = Math.min(12, incoming / 2, outgoing / 2);
      path += ` L${b.x + (a.x - b.x) * r / incoming},${b.y + (a.y - b.y) * r / incoming} Q${b.x},${b.y} ${b.x + (c.x - b.x) * r / outgoing},${b.y + (c.y - b.y) * r / outgoing}`;
    }
    const last = points[points.length - 1];
    return path + ` L${last.x},${last.y}`;
  }
  function setDiagramZoom(svg, requested) {
    const zoom = Number.isFinite(requested) ? Math.min(4, Math.max(1, requested)) : 1;
    svg.style.width = `${zoom * 100}%`;
    svg.style.height = `${zoom * 100}%`;
    return zoom;
  }
  function drawDiagram(svg) {
    // Keep saved positions; give component names more room than the compact workspace nodes.
    const W = 124, H = 40, pad = 20;
    const nodes = config.design.nodes;
    if (!nodes.length) { svg.innerHTML = ""; return; }
    const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
    const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
    svg.setAttribute("viewBox", `${minX} ${minY} ${Math.max(...xs) + W + pad - minX} ${Math.max(...ys) + H + pad - minY}`);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const edges = config.design.edges.map((e) => {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (!a || !b) return "";
      const from = { x: a.x + W, y: a.y + H / 2 }, to = { x: b.x, y: b.y + H / 2 };
      let points;
      if (to.x >= from.x) {
        const mid = (from.x + to.x) / 2;
        points = [from, { x: mid, y: from.y }, { x: mid, y: to.y }, to];
      } else {
        const lane = Math.max(a.y, b.y) + H + 20;
        points = [from, { x: from.x + 20, y: from.y }, { x: from.x + 20, y: lane }, { x: to.x - 20, y: lane }, { x: to.x - 20, y: to.y }, to];
      }
      return `<path class="edge" data-edge="${html(e.source)}>${html(e.target)}" d="${roundedRoute(points)}"/>`;
    }).join("");
    const truncate = (value, max) => value.length > max ? value.slice(0, max - 1) + "\u2026" : value;
    const boxes = nodes.map((n) => {
      const type = nodeTypes[n.type] ?? n.type;
      const technology = config.components.find((part) => part.node === n.id)?.what?.split(" \u00b7 ")[0] ?? type;
      const meta = n.label === type || technology === type ? technology : `${type} \u00b7 ${technology}`;
      const incoming = config.design.edges.some((e) => e.target === n.id);
      const outgoing = config.design.edges.some((e) => e.source === n.id);
      return `<g class="node${n.added ? " added" : ""}" data-node="${html(n.id)}" transform="translate(${n.x},${n.y})" role="button" tabindex="0" aria-pressed="false" aria-label="Inspect ${html(n.label)}">
        <rect class="selection-ring" x="-3" y="-3" width="${W + 6}" height="${H + 6}" rx="15"/>
        <rect class="node-face" width="${W}" height="${H}" rx="12"/>
        <rect class="icon-tile" x="8" y="10" width="20" height="20" rx="3" fill="${nodeFamily(n.type)}"/>
        <svg x="10" y="12" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${nodeFamily(n.type)}" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">${nodeGlyphs[n.type] ?? nodeGlyphs.custom}</svg>
        <text x="34" y="18" class="name">${html(truncate(n.label, 12))}</text>
        <text x="34" y="29" class="type">${html(truncate(meta, 19))}</text>
        ${incoming ? `<circle class="handle" cx="0" cy="${H / 2}" r="2.5"/>` : ""}
        ${outgoing ? `<circle class="handle" cx="${W}" cy="${H / 2}" r="2.5"/>` : ""}
        <title>${html(`${n.label} (${meta}${n.added ? ", added by the app" : ""})`)}</title>
      </g>`;
    }).join("");
    svg.innerHTML = edges + boxes;
  }
  const diagramNodes = (node) => document.querySelectorAll(`.diagram .node[data-node="${CSS.escape(node)}"]`);
  // Parts added by the app (the page's web server) are drawn; the browser stands for the client.
  const drawn = (node) => (config.design.nodes.some((n) => n.id === node) ? node : null);
  function setState(node, state) {
    const id = drawn(node);
    if (!id) return;
    nodeStates.set(id, state);
    for (const el of diagramNodes(id)) {
      el.classList.remove("active", "done", "fail", "idle");
      if (state) el.classList.add(state);
    }
    renderNodeInspector();
  }
  function lightEdge(from, to) {
    if (!from || !to || from === to) return;
    for (const el of document.querySelectorAll(`.diagram .edge[data-edge="${CSS.escape(`${from}>${to}`)}"], .diagram .edge[data-edge="${CSS.escape(`${to}>${from}`)}"]`)) el.classList.add("lit");
  }
  function clearDiagram() {
    nodeStates.clear();
    for (const el of document.querySelectorAll(".diagram .node")) el.classList.remove("active", "done", "fail", "idle");
    for (const el of document.querySelectorAll(".diagram .edge.lit")) el.classList.remove("lit");
  }

  // ---- What each request did, part by part (from the trace headers and steps) ----
  const ip = (value) => (value ?? "").split(",").map((part) => part.trim()).filter(Boolean).at(-1) ?? "";
  const containerAt = (address) => config.addresses[address.replace(/:\d+$/, "")] ?? address;
  function stepsFor(trace) {
    const out = [];
    const header = (name) => trace.headers.get(name);
    const serverNode = config.server.node;
    const authOnPath = config.auth.mode === "on-path" ? config.auth.node : null;
    const firstServerStep = trace.steps.findIndex((s) => s.node === serverNode);
    const authSteps = authOnPath ? trace.steps.slice(0, firstServerStep === -1 ? trace.steps.length : firstServerStep) : [];
    const serverSteps = firstServerStep === -1 ? (authOnPath ? [] : trace.steps) : trace.steps.slice(firstServerStep);
    const clientNode = config.path[0]?.node;
    if (clientNode) out.push({ node: clientNode, kind: "client", text: `Your browser sent <code>${html(trace.method)} ${html(trace.path.split("?")[0])}</code>.` });
    for (const hop of config.path.slice(1)) {
      if (hop.kind === "dns") {
        const answer = ip(header(`X-Trace-${hop.resolvedBy}`));
        if (!answer || answer === "-" || answer === "dns-failed") return [...out, { node: hop.node, kind: "dns", text: `No answer for <code>${html(hop.name)}</code>.`, ok: false }];
        out.push({ node: hop.node, kind: "dns", name: hop.name, answer: answer.replace(/:\d+$/, ""), text: `Asked “where is <code>${html(hop.name)}</code>?” and got <code>${html(answer.replace(/:\d+$/, ""))}</code> (${html(containerAt(answer))}).` });
      } else if (hop.kind === "proxy") {
        const answer = ip(header(`X-Trace-${hop.container}`));
        if (!answer || answer === "-") return [...out, { node: hop.node, kind: "proxy", text: `${html(hop.label)} could not reach the next part.`, ok: false }];
        out.push({ node: hop.node, kind: hop.cdn ? "cdn" : "proxy", next: containerAt(answer), text: `${html(hop.does)} → <code>${html(containerAt(answer))}</code>.` });
      } else if (hop.kind === "auth") {
        if (!header(`X-Trace-${hop.container}`) && authSteps.length === 0) return [...out, { node: hop.node, kind: "auth", text: "The request did not get here.", ok: false }];
        out.push(...authSteps.map((s) => ({ ...s, text: html(s.text) })));
        if (header(`X-Trace-${hop.container}`) === "blocked" || trace.path.startsWith("/api/auth/")) return out;
      } else if (hop.kind === "pass") {
        out.push({ node: hop.node, kind: "pass", text: html(hop.does) });
      } else if (hop.kind === "server") {
        const instance = header("X-Trace-Api");
        if (!instance) return [...out, { node: hop.node, kind: "server", text: `No API server answered (${trace.status || "no response"}).`, ok: false }];
        out.push(...serverSteps.map((s) => ({ ...s, instance, text: html(s.text) })));
      }
    }
    return out.filter((s) => s.node);
  }

  // ---- Archie: the same steps, in plain words ----
  const label = (node) => config.labels[node] ?? "this part";
  const typeOf = (node) => config.design.nodes.find((n) => n.id === node)?.type ?? (node === "__web" ? "web-app" : node === config.server.node ? "server" : "");
  function explain(step, trace) {
    const name = `<b>${html(label(step.node))}</b>`;
    const t = plain(step.text);
    const has = (pattern) => pattern.test(t);
    const action = trace.label.toLowerCase();
    switch (typeOf(step.node)) {
      case "client":
        return `This is you! When you chose “${html(trace.label)}”, your browser sent a request into the system. Let's follow it.`;
      case "web-app":
        if (step.ok === false) break;
        return `${name} is the web server that gave you this page. For “${html(action)}”, it hands your request to the next part.`;
      case "cdn":
        if (step.ok === false) break;
        return `${name} keeps copies of pages close to people so they load fast. Your data isn't cached, so this request goes straight through.`;
      case "dns":
        if (step.ok === false) return `${name} is the internet's phone book, but it had no number for <code>${html(trace.path)}</code>'s next stop, so the request got lost.`;
        return `${name} is like the internet's phone book: it looked up where <code>${html(step.name)}</code> lives and answered <code>${html(step.answer)}</code>.`;
      case "load-balancer":
        if (step.ok === false) break;
        return `${name} spreads the work so no single server gets overwhelmed. This time it picked <b>${html(step.next)}</b>; next time it may pick another.`;
      case "api-gateway":
        if (step.ok === false) break;
        return `${name} is the API's front door: it checks where the request should go and routes it there.`;
      case "auth":
        if (has(/creating an account/i)) return `${name} handles accounts. It's setting up a new one for you.`;
        if (has(/^signing in/i)) return `${name} handles sign-in. It's checking who you are.`;
        if (has(/rejected the form/i)) return `${name} sent the form back: ${html(t.replace(/^rejected the form:\s*/i, ""))}`;
        if (has(/email is taken/i)) return `${name} found that email already has an account, so it can't make another. Try signing in instead.`;
        if (has(/no such account/i)) return `${name} couldn't find an account with that email. Create one first!`;
        if (has(/turned the password/i)) return `${name} scrambled your password into a “hash”, so the real password is never stored, not even in the database.`;
        if (has(/hashed the password/i)) return `${name} scrambled the password you typed the same way and compared it with the saved one. ${has(/does not match/i) ? "They don't match, so you're not let in." : "They match, so it's really you!"}`;
        if (has(/no session cookie/i)) return `${name} found no sign-in ticket, so you're not signed in yet.`;
        if (has(/unknown|expired/i)) return `${name} didn't recognise your sign-in ticket (it may have expired), so you're not signed in.`;
        if (has(/checked the session/i)) return `${name} checked your sign-in ticket (a cookie your browser sent along) to make sure it's really you.`;
        if (has(/signed you in/i)) return `${name} gave your browser a sign-in ticket (a cookie), so you stay signed in.`;
        if (has(/ended the session/i)) return `${name} signed you out by cancelling your sign-in ticket.`;
        if (has(/let the request through/i)) return `${name} is happy it's you and lets the request continue.`;
        if (has(/stopped/i)) return `${name} stopped the request: you need to sign in first.`;
        break;
      case "server":
        if (has(/received/i)) return `${name} is where the app's own code runs. <b>${html(step.instance ?? "")}</b> got your request and works out what to do.`;
        if (has(/passed the request to the auth/i)) return `${name} passes sign-in requests to <b>${html(label(config.auth.node))}</b>, the part of your design that handles accounts.`;
        if (has(/asked the auth/i)) return `${name} asks <b>${html(label(config.auth.node))}</b> whether you're really signed in.`;
        if (has(/handled sign-in itself/i)) return `${name} handles sign-in itself, because the design has no separate sign-in service.`;
        if (has(/memory/i)) return `${name} keeps items in its own memory because the design has no database, so they'd be lost on restart.`;
        if (has(/rejected the form/i)) return `${name} sent the form back: ${html(t.replace(/^rejected the form:\s*/i, ""))}`;
        if (has(/on the queue/i)) return `${name} put a job on the waiting line and answered you straight away; a worker does the job in the background.`;
        break;
      case "database":
        if (has(/account/i)) return `${name} looks up whether an account with that email exists. ${has(/found/i) ? "It does!" : "Not yet."}`;
        if (has(/session/i)) return `${name} ${has(/deleted/i) ? "throws away your sign-in ticket." : has(/saved/i) ? "remembers your sign-in ticket, so you stay signed in." : "looks up your sign-in ticket to check it's valid."}`;
        if (has(/saved user/i)) return `${name} is the app's long-term memory. It's saving your account: your email and the scrambled password, never the real one.`;
        if (has(/saved item|saved where/i)) return `${name} is the app's long-term memory. It's saving your information now, so it's still there tomorrow, even if the app restarts.`;
        if (has(/updated/i)) return `${name} saves your changes, so everyone sees the latest version.`;
        if (has(/deleted/i)) return `${name} deletes the item for good.`;
        if (has(/read/i)) return `${name} reads your items from storage so the app can show them.`;
        break;
      case "cache":
        if (has(/hit/i)) return `${name} remembered this answer from a moment ago, so the database didn't have to do any work. That's why caches make apps fast!`;
        if (has(/miss/i)) return `${name} doesn't have this answer yet, so the server asks the database.`;
        if (has(/saved the list/i)) return `${name} keeps a copy of the answer for a minute, so the next look is instant.`;
        if (has(/removed/i)) return `${name} forgets its old copy, because your data just changed.`;
        break;
      case "queue":
        if (has(/waited in line/i)) return `Your item's job waited its turn in ${name} until a worker was free.`;
        return `${name} is a waiting line for jobs. The app answers you straight away, and the work happens in the background.`;
      case "worker":
        return `${name} takes jobs off the line one at a time and does the work: here, counting your item's words.`;
      case "search":
        if (has(/removed/i)) return `${name} takes the item out of its search index.`;
        if (has(/indexed/i)) return `${name} adds the item to its index, like a book's index, so searching is fast.`;
        if (has(/searched/i)) return `${name} looked up your words in its index and found the matches in a blink, without reading every item.`;
        break;
      case "object-storage":
        if (step.ok === false) break;
        return `${name} is where files like photos and documents live. Your file is stored safely here.`;
    }
    return step.ok === false ? `Uh oh: ${name} couldn't do its part. ${html(t)}` : `${name}: ${html(t)}`;
  }

  function say(htmlText, talking = false) {
    $("say").innerHTML = htmlText;
    $("face").classList.toggle("talking", talking);
  }

  // ---- Playing a request: light up the parts, Archie explains each ----
  // Something that happened in the background (the worker finishing) waits its turn;
  // something you just did plays straight away.
  async function play(trace, steps = stepsFor(trace), { background = false } = {}) {
    if (background && busy) return void waiting.push([trace, steps]);
    displayedTrace = trace;
    renderTraceSummary(trace);
    const run = ++playing;
    pendingIntro = null;
    fast = false;
    busy = true;
    clearDiagram();
    for (const el of document.querySelectorAll(".diagram .node")) el.classList.add("idle");
    renderNodeInspector();
    $("steps").innerHTML = steps
      .map((s) => `<li data-step class="${s.ok === false ? "fail" : ""}"><b>${html(label(s.node))}.</b> ${s.text}${s.ms !== undefined ? ` <span class="meta">${s.ms} ms</span>` : ""}</li>`)
      .join("");
    $("skip").hidden = quiet;
    let previous = null;
    for (const [index, s] of steps.entries()) {
      if (run !== playing) return;
      const node = drawn(s.node) ?? previous;
      setState(s.node, "active");
      $("map-now").innerHTML = `Now: <b>${html(label(s.node))}</b>`;
      lightEdge(previous, drawn(s.node));
      $("steps").children[index]?.classList.add("current");
      if (!quiet) say(explain(s, trace), true);
      if (!fast) await new Promise((resolve) => setTimeout(resolve, quiet ? 650 : STEP_MS));
      if (run !== playing) return;
      setState(s.node, s.ok === false ? "fail" : "done");
      $("steps").children[index]?.classList.remove("current");
      previous = node;
    }
    $("skip").hidden = true;
    $("map-now").textContent = "";
    busy = false;
    const failed = steps.find((s) => s.ok === false);
    if (!quiet) {
      say(
        failed
          ? `That one stopped at <b>${html(label(failed.node))}</b>, shown in red. Every step is listed under “What happened”.`
          : `Done! “${html(trace.label)}” went through ${steps.length} step${steps.length === 1 ? "" : "s"}. They're all listed under “What happened”, and you can replay them.`,
      );
    }
    showPage();
    if (waiting.length) {
      const [nextTrace, nextSteps] = waiting.shift();
      setTimeout(() => {
        if (run === playing) play(nextTrace, nextSteps);
      }, 1500);
      return;
    }
    // A page change during the request (signing in, say): introduce the new page after.
    if (pendingIntro) {
      const intro = pendingIntro;
      pendingIntro = null;
      setTimeout(() => {
        if (run === playing && !busy && !quiet) say(intro);
      }, fast ? 1200 : 3500);
    }
  }

  // ---- Pages: which parts of the design serve the page you are on ----
  function pageParts() {
    const path = config.path.map((hop) => hop.node);
    if (page === "signin") {
      const authAt = path.indexOf(config.auth.node);
      const toAuth = authAt >= 0 ? path.slice(0, authAt + 1) : path;
      return [...toAuth, ...(config.auth.database ? [config.auth.database] : []), ...(config.auth.mode === "service" ? [config.auth.node] : [])];
    }
    return [...path, ...Object.values(config.data).filter(Boolean).map((part) => part.node), ...(config.auth.mode === "service" ? [config.auth.node] : [])];
  }
  function showPage() {
    const parts = new Set(pageParts());
    for (const el of document.querySelectorAll(".diagram .node")) el.classList.toggle("page", parts.has(el.dataset.node));
  }
  const pathWords = () => config.path.slice(1).filter((hop) => hop.kind !== "pass").map((hop) => `<b>${html(hop.label)}</b>`).join(" → ");
  function setPage(next) {
    if (page === next) return;
    page = next;
    showPage();
    if (quiet) return;
    const db = config.data.database;
    const intro =
      next === "signin"
        ? `Hi, I'm Archie! This sign-in page is part of your design: the parts outlined in blue in your design serve it. When you sign in, your details travel ${pathWords()} and are checked by <b>${html(label(config.auth.node))}</b>.`
        : `${config.features.auth ? "You're in! " : "Hi, I'm Archie! "}This is the app built from your design. Everything you do travels ${pathWords()}${db ? `, and what you add is saved in <b>${html(db.label)}</b>` : ""}. Try adding an item on the right and watch your design here!`;
    if (busy) pendingIntro = intro;
    else {
      clearDiagram();
      say(intro);
    }
  }

  // ---- Accounts ----
  function setTab(isSignup) {
    signup = isSignup;
    $("tab-signin").setAttribute("aria-selected", String(!isSignup));
    $("tab-signup").setAttribute("aria-selected", String(isSignup));
    $("auth-go").textContent = isSignup ? "Create account" : "Sign in";
    $("password").autocomplete = isSignup ? "new-password" : "current-password";
    $("auth-error").textContent = "";
  }
  function signedIn(next) {
    if (user?.id !== next?.id) { editDrafts.clear(); itemLoadVersion++; }
    user = next;
    $("who").hidden = !user?.email;
    $("who").textContent = user?.email ?? "";
    $("signout").hidden = !config.features.auth || !user;
    $("auth").hidden = !config.features.auth || Boolean(user);
    $("app").hidden = config.features.auth && !user;
    setPage($("app").hidden ? "signin" : "items");
    if (!$("app").hidden) loadItems({ quiet: true });
  }

  // ---- Items ----
  function renderItems() {
    const focus = captureEditorFocus();
    $("empty").hidden = items.length > 0;
    $("items").innerHTML = items
      .map(
        (item) => `<li class="item" data-id="${item.id}">
          ${editDrafts.has(item.id) ? renderItemEditor(item, editDrafts.get(item.id)) : `<h3>${html(item.title)}</h3>${item.body ? `<p>${html(item.body)}</p>` : ""}`}
          <div class="row">
            <span class="badge ${html(item.status)}">${html(item.status)}</span>
            ${item.status === "processed" ? `<span class="meta">${item.wordCount} words · by ${html(item.processedBy)}</span>` : ""}
            ${item.hasFile ? `<a href="${BASE}/api/items/${item.id}/file" class="meta">📎 ${html(item.fileName)}</a>` : ""}
          </div>
          ${editDrafts.has(item.id) ? "" : `<div class="row" style="margin-top: 8px;">
            ${config.features.queue ? `<button data-act="process" ${item.status === "queued" ? "disabled" : ""}>Process</button>` : ""}
            <button data-act="edit">Edit</button>
            <button class="destructive" data-act="delete">Delete</button>
          </div>`}
        </li>`,
      )
      .join("");
    restoreEditorFocus(focus);
  }
  let pollTimer = null, itemLoadVersion = 0;
  async function loadItems({ quiet: background = false } = {}) {
    const version = ++itemLoadVersion;
    const q = $("q").value.trim();
    try {
      const before = new Map(items.map((item) => [item.id, item.status]));
      const result = await api("GET", `/api/items${q ? `?q=${encodeURIComponent(q)}` : ""}`, { label: q ? `Search “${q}”` : "Load your items", quiet: background });
      if (version !== itemLoadVersion) return;
      items = result.items;
      $("items-error").textContent = "";
      renderItems();
      // The worker finished something since the last look: show that part too.
      const done = items.find((item) => item.status === "processed" && before.get(item.id) === "queued");
      if (done && config.data.worker) {
        const trace = { label: `Worker processed item #${done.id} (observed)`, method: "GET", path: "/api/items", status: 200, headers: new Headers(), steps: [], time: new Date() };
        trace.fixed = [
          { node: config.data.queue.node, text: `The job for item #${done.id} waited in line on the queue.` },
          { node: config.data.worker.node, text: `${html(done.processedBy)} took the job and counted ${done.wordCount} words.` },
          ...(config.data.database ? [{ node: config.data.database.node, text: "Saved item #" + done.id + " as processed." }] : []),
        ];
        history.unshift(trace);
        renderHistory();
        play(trace, trace.fixed, { background: true });
      }
    } catch (error) {
      if (version !== itemLoadVersion) return;
      if (error.status === 401 && config.features.auth) signedIn(null);
      else $("items-error").textContent = error.message;
    }
    clearTimeout(pollTimer);
    if (items.some((item) => item.status === "queued")) pollTimer = setTimeout(() => loadItems({ quiet: true }), 1500);
  }

  function renderHistory() {
    $("history").disabled = history.length === 0;
    $("replay").disabled = history.length === 0;
    $("history").innerHTML = !history.length ? "<option>No requests yet</option>" : history
      .map((trace, index) => `<option value="${index}">${html(trace.time.toLocaleTimeString())} · ${html(trace.label)}${trace.status ? ` · ${trace.status}` : ""}</option>`)
      .join("");
  }

  // ---- Workbench helpers ----
  const splitStorageKey = `architech-run-split:${BASE || "export"}`;
  const editDrafts = new Map();
  const nodeStates = new Map();
  let inspectedNodeId = null, displayedTrace = null;

  function splitLimits(width) {
    if (!Number.isFinite(width) || width < 900) return { min: 25, max: 75 };
    return { min: Math.max(25, 320 / width * 100), max: Math.min(75, (width - 328) / width * 100) };
  }
  function clampSplit(value, width) {
    const { min, max } = splitLimits(width);
    return Math.max(min, Math.min(max, Number.isFinite(value) ? value : 46));
  }
  function applySplit(value, { persist = false } = {}) {
    const width = $("split").getBoundingClientRect().width;
    const percent = clampSplit(value, width);
    const { min, max } = splitLimits(width);
    $("split").style.setProperty("--split-size", `${percent}%`);
    $("pane-divider").setAttribute("aria-valuemin", String(min));
    $("pane-divider").setAttribute("aria-valuemax", String(max));
    $("pane-divider").setAttribute("aria-valuenow", String(percent));
    $("pane-divider").setAttribute("aria-valuetext", `Architecture ${Math.round(percent)}%, app ${Math.round(100 - percent)}%`);
    if (persist) {
      try { localStorage.setItem(splitStorageKey, String(percent)); } catch { /* Optional layout preference; resizing still works without storage. */ }
    }
    return percent;
  }
  function restoreSplit() {
    let value = 46;
    try {
      const saved = localStorage.getItem(splitStorageKey);
      if (saved?.trim() && Number.isFinite(Number(saved))) value = Number(saved);
    } catch { /* Storage can be unavailable in exported/private browsing contexts. */ }
    return applySplit(value);
  }
  function traceSummary(trace) {
    return {
      method: trace.method ?? "Not recorded",
      path: trace.path ?? "Not recorded",
      status: trace.status === 0 ? "Network error" : String(trace.status ?? "Not recorded"),
      duration: Number.isFinite(trace.durationMs) && trace.durationMs >= 0 ? `${Math.round(trace.durationMs)} ms` : "Not measured",
    };
  }
  function renderTraceSummary(trace) {
    const summary = traceSummary(trace);
    $("request-summary").hidden = false;
    $("request-label").textContent = trace.label;
    for (const field of ["method", "path", "status", "duration"]) $(`request-${field}`).textContent = summary[field];
    $("request-status").dataset.state = trace.status === 0 || trace.status >= 400 ? "failed" : "complete";
  }
  function nodeInspectionData(id) {
    const node = config.design.nodes.find((candidate) => candidate.id === id);
    if (!node) return null;
    let latest = null, step = null;
    for (const trace of history) {
      const matches = (trace.fixed ?? stepsFor(trace)).filter((candidate) => candidate.node === id);
      if (matches.length) { latest = trace; step = matches.at(-1); break; }
    }
    const live = latest && latest === displayedTrace ? nodeStates.get(id) : null;
    const state = live === "active" ? "Running" : live === "fail" ? "Failed" : live === "done" ? "Completed"
      : latest === displayedTrace && latest ? "Waiting" : step ? (step.ok === false ? "Failed" : "Completed") : "No request recorded";
    return {
      name: node.label,
      type: nodeTypes[node.type] ?? node.type,
      technology: config.components.find((part) => part.node === id)?.what ?? "Not used by this runnable app",
      request: latest?.label ?? "None",
      state,
      detail: step ? plain(step.text) : "None",
    };
  }
  function renderNodeInspector() {
    const data = nodeInspectionData(inspectedNodeId);
    $("node-inspector").hidden = !data;
    if (!data) return;
    for (const field of ["name", "type", "technology", "request", "state", "detail"]) $(`node-${field}`).textContent = data[field];
  }
  function selectNode(id) {
    inspectedNodeId = config.design.nodes.some((node) => node.id === id) ? id : null;
    for (const el of document.querySelectorAll(".diagram .node")) {
      const selected = el.dataset.node === inspectedNodeId;
      el.classList.toggle("selected", selected);
      el.setAttribute("aria-pressed", String(selected));
    }
    renderNodeInspector();
  }
  function renderItemEditor(item, draft) {
    const disabled = draft.saving ? "disabled" : "";
    return `<form class="edit-form stack" data-edit-id="${item.id}" tabindex="-1" aria-label="Edit item" aria-busy="${draft.saving}">
      <label for="edit-title-${item.id}">Title</label>
      <input id="edit-title-${item.id}" name="title" value="${html(draft.title)}" required maxlength="200" ${disabled}>
      <label for="edit-body-${item.id}">Text</label>
      <textarea id="edit-body-${item.id}" name="body" maxlength="10000" ${disabled}>${html(draft.body)}</textarea>
      <p class="error" role="alert">${html(draft.error)}</p>
      <div class="row"><button class="primary" type="submit" data-act="save-edit" ${disabled}>${draft.saving ? "Saving…" : "Save"}</button><button type="button" data-act="cancel-edit" ${disabled}>Cancel</button></div>
    </form>`;
  }
  function captureEditorFocus() {
    const active = document.activeElement;
    const item = active?.closest?.(".item[data-id]");
    if (item && active.dataset?.act && $("items").contains(active)) return { id: Number(item.dataset.id), action: active.dataset.act };
    const form = active?.closest?.("form[data-edit-id]");
    if (!form || !$("items").contains(active)) return null;
    if (active === form) return { id: Number(form.dataset.editId), form: true };
    return { id: Number(form.dataset.editId), name: active.name, start: active.selectionStart, end: active.selectionEnd };
  }
  function restoreEditorFocus(focus) {
    if (focus?.form) {
      $("items").querySelector(`form[data-edit-id="${focus.id}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (focus?.action && ["edit", "delete", "process", "cancel-edit", "save-edit"].includes(focus.action)) {
      $("items").querySelector(`[data-id="${focus.id}"] [data-act="${focus.action}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (!focus || !["title", "body"].includes(focus.name)) return;
    const input = $(`edit-${focus.name}-${focus.id}`);
    if (!input || input.disabled) return;
    input.focus({ preventScroll: true });
    if (Number.isInteger(focus.start) && Number.isInteger(focus.end)) input.setSelectionRange(focus.start, focus.end);
  }
  function focusItemAction(id) {
    $("items").querySelector(`[data-id="${id}"] [data-act="edit"]`)?.focus({ preventScroll: true });
  }
  function editorHasFocus(id) {
    const active = document.activeElement;
    return !active || active === document.body || active.closest?.("form[data-edit-id]")?.dataset.editId === String(id);
  }
  function beginEdit(id) {
    const item = items.find((candidate) => candidate.id === id);
    if (!item) return;
    if (!editDrafts.has(id)) editDrafts.set(id, { title: item.title, body: item.body ?? "", error: "", saving: false });
    renderItems();
    $(`edit-title-${id}`)?.focus({ preventScroll: true });
  }
  function cancelEdit(id) {
    if (editDrafts.get(id)?.saving) return;
    editDrafts.delete(id);
    renderItems();
    focusItemAction(id);
  }
  async function saveEdit(id) {
    const draft = editDrafts.get(id);
    if (!draft || draft.saving) return;
    const title = draft.title.trim(), body = draft.body;
    draft.error = !title || title.length > 200 ? "Give the item a title (up to 200 characters)."
      : body.length > 10000 ? "Keep the text under 10,000 characters." : "";
    if (draft.error) { renderItems(); return; }
    const previousFocus = captureEditorFocus() ?? { id, name: "title" };
    draft.saving = true;
    renderItems();
    $("items").querySelector(`form[data-edit-id="${id}"]`)?.focus({ preventScroll: true });
    try {
      const result = await api("PATCH", `/api/items/${id}`, { body: { title, body }, label: `Edit “${title}”` });
      if (editDrafts.get(id) !== draft) return;
      const restoreFocus = editorHasFocus(id);
      items = items.map((item) => item.id === id ? { ...item, ...result.item, title, body } : item);
      editDrafts.delete(id);
      renderItems();
      if (restoreFocus) focusItemAction(id);
      await loadItems({ quiet: true });
    } catch (error) {
      if (editDrafts.get(id) === draft) draft.error = error.message;
    } finally {
      draft.saving = false;
      if (editDrafts.get(id) === draft) {
        const restoreFocus = editorHasFocus(id);
        renderItems();
        if (draft.error && restoreFocus) restoreEditorFocus(previousFocus);
      }
    }
  }

  // ---- Wiring ----
  let splitPercent = restoreSplit();
  const divider = $("pane-divider");
  const wideLayout = matchMedia("(min-width: 901px)");
  let dividerPointer = null;
  function updateDividerMode() {
    divider.tabIndex = wideLayout.matches ? 0 : -1;
    if (!wideLayout.matches) { dividerPointer = null; divider.classList.remove("dragging"); }
    if (wideLayout.matches) splitPercent = applySplit(splitPercent);
  }
  function finishResize(event) {
    if (event.pointerId !== dividerPointer) return;
    dividerPointer = null;
    divider.classList.remove("dragging");
    splitPercent = applySplit(splitPercent, { persist: true });
  }
  divider.addEventListener("pointerdown", (event) => {
    if (!wideLayout.matches || event.button !== 0) return;
    event.preventDefault();
    divider.focus();
    dividerPointer = event.pointerId;
    divider.setPointerCapture(event.pointerId);
    divider.classList.add("dragging");
  });
  divider.addEventListener("pointermove", (event) => {
    if (dividerPointer !== event.pointerId) return;
    const rect = $("split").getBoundingClientRect();
    splitPercent = applySplit((event.clientX - rect.left) / rect.width * 100);
  });
  for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) divider.addEventListener(name, finishResize);
  divider.addEventListener("keydown", (event) => {
    if (!wideLayout.matches) return;
    const { min, max } = splitLimits($("split").getBoundingClientRect().width);
    const next = { ArrowLeft: splitPercent - 2, ArrowRight: splitPercent + 2, Home: min, End: max }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    splitPercent = applySplit(next, { persist: true });
  });
  divider.addEventListener("dblclick", () => { splitPercent = applySplit(46, { persist: true }); });
  wideLayout.addEventListener("change", updateDividerMode);
  window.addEventListener("resize", updateDividerMode);
  updateDividerMode();
  $("big-svg").addEventListener("click", (event) => {
    const node = event.target.closest(".node[data-node]");
    selectNode(node?.dataset.node ?? null);
  });
  $("big-svg").addEventListener("keydown", (event) => {
    const node = event.target.closest(".node[data-node]");
    if (node && ["Enter", " "].includes(event.key)) {
      event.preventDefault();
      selectNode(node.dataset.node);
    } else if (event.key === "Escape") selectNode(null);
  });
  $("node-close").addEventListener("click", () => {
    const previous = inspectedNodeId;
    selectNode(null);
    if (previous) diagramNodes(previous)[0]?.focus({ preventScroll: true });
  });
  let diagramZoom = 1;
  function updateZoom(requested) {
    diagramZoom = setDiagramZoom($("big-svg"), requested);
    $("zoom-level").textContent = `${Math.round(diagramZoom * 100)}%`;
    $("zoom-out").disabled = diagramZoom <= 1;
    $("zoom-in").disabled = diagramZoom >= 4;
  }
  $("zoom-in").addEventListener("click", () => updateZoom(diagramZoom + .25));
  $("zoom-out").addEventListener("click", () => updateZoom(diagramZoom - .25));
  $("zoom-fit").addEventListener("click", () => {
    updateZoom(1);
    $("diagram-viewport").scrollTo(0, 0);
  });
  $("history").addEventListener("change", (event) => {
    const trace = history[Number(event.target.value)];
    if (trace) play(trace, trace.fixed ?? stepsFor(trace));
  });
  $("replay").addEventListener("click", () => {
    const trace = history[Number($("history").value) || 0];
    if (trace) play(trace, trace.fixed ?? stepsFor(trace));
  });
  $("skip").addEventListener("click", () => {
    fast = true;
  });
  const setQuiet = (value) => {
    quiet = value;
    try { localStorage.setItem("archie-quiet", value ? "1" : "0"); } catch {}
    $("bubble").hidden = value;
    $("archie-off").hidden = !value;
    if (!value) say("I'm back! Do something in the app and I'll explain what each part of your design does.");
  };
  $("quiet").addEventListener("click", () => setQuiet(true));
  $("face").addEventListener("click", () => setQuiet(!quiet));
  $("tab-signin").addEventListener("click", () => setTab(false));
  $("tab-signup").addEventListener("click", () => setTab(true));
  $("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("auth-go").disabled = true;
    $("auth-error").textContent = "";
    try {
      const result = await api("POST", `/api/auth/${signup ? "signup" : "signin"}`, { body: { email: $("email").value, password: $("password").value }, label: signup ? "Create account" : "Sign in" });
      $("password").value = "";
      signedIn(result.user);
    } catch (error) {
      $("auth-error").textContent = error.message;
    } finally {
      $("auth-go").disabled = false;
    }
  });
  $("signout").addEventListener("click", async () => {
    await api("POST", "/api/auth/signout", { label: "Sign out" }).catch(() => undefined);
    items = [];
    signedIn(null);
  });
  $("new").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("new-go").disabled = true;
    $("new-error").textContent = "";
    try {
      const { item } = await api("POST", "/api/items", { body: { title: $("new-title").value, body: $("new-body").value }, label: "Add an item" });
      const file = $("new-file").files?.[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) throw new Error("The item was added, but the file is over 5 MB.");
        await api("PUT", `/api/items/${item.id}/file`, { raw: file, headers: { "Content-Type": file.type || "application/octet-stream", "X-File-Name": file.name }, label: `Attach ${file.name}`, then: true });
      }
      $("new").reset();
      await loadItems({ quiet: true });
    } catch (error) {
      $("new-error").textContent = error.message;
    } finally {
      $("new-go").disabled = false;
    }
  });
  $("refresh").addEventListener("click", () => loadItems());
  $("search").addEventListener("submit", (event) => {
    event.preventDefault();
    loadItems();
  });
  $("items").addEventListener("input", (event) => {
    const form = event.target.closest("form[data-edit-id]");
    const draft = form && editDrafts.get(Number(form.dataset.editId));
    if (draft && !draft.saving && ["title", "body"].includes(event.target.name)) draft[event.target.name] = event.target.value;
  });
  $("items").addEventListener("submit", (event) => {
    const form = event.target.closest("form[data-edit-id]");
    if (!form) return;
    event.preventDefault();
    saveEdit(Number(form.dataset.editId));
  });
  $("items").addEventListener("keydown", (event) => {
    const form = event.target.closest("form[data-edit-id]");
    if (form && event.key === "Escape") {
      event.preventDefault();
      cancelEdit(Number(form.dataset.editId));
    }
  });
  $("items").addEventListener("click", async (event) => {
    const button = event.target.closest("button[data-act]");
    if (!button) return;
    const id = Number(button.closest("[data-id]").dataset.id);
    const item = items.find((candidate) => candidate.id === id);
    if (!Number.isSafeInteger(id) || id < 1 || !item) return;
    if (button.dataset.act === "edit") { beginEdit(id); return; }
    if (button.dataset.act === "cancel-edit") { cancelEdit(id); return; }
    if (button.dataset.act === "save-edit") return; // The form's submit handler owns saving.
    try {
      if (button.dataset.act === "delete") {
        if (!confirm(`Delete “${item.title}”?`)) return;
        await api("DELETE", `/api/items/${id}`, { label: `Delete “${item.title}”` });
      } else if (button.dataset.act === "process") {
        await api("POST", `/api/items/${id}/process`, { label: `Process “${item.title}”` });
      }
      await loadItems({ quiet: true });
    } catch (error) {
      alert(error.message);
    }
  });

  (async function start() {
    config = await (await fetch(`${BASE}/app.config.json`, { cache: "no-store" })).json();
    document.title = config.title;
    $("title").textContent = config.title;
    config.labels = Object.fromEntries([...config.components.map((part) => [part.node, part.label]), ...config.design.nodes.map((n) => [n.id, n.label])]);
    $("search").hidden = !config.features.search;
    $("new-file-row").hidden = !config.features.files;
    $("bubble").hidden = quiet;
    $("archie-off").hidden = !quiet;
    drawDiagram($("big-svg"));
    // The step list starts open where there is room for it.
    $("what").open = matchMedia("(min-width: 901px)").matches;
    if (config.features.auth) {
      try {
        const result = await api("GET", "/api/auth/me", { label: "Check if you're signed in", quiet: true });
        signedIn(result.user);
      } catch {
        signedIn(null);
      }
    } else {
      signedIn(null);
    }
  })();
</script>
</body>
</html>
