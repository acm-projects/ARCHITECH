<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1020" viewBox="125 100 1000 1020"
     role="img" aria-labelledby="title">
  <title id="title">Archie with a centered hard hat and black eyes</title>

  <defs>
    <linearGradient id="body" x1="240" y1="1000" x2="950" y2="400"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#009bff"/>
      <stop offset="1" stop-color="#0091ff"/>
    </linearGradient>
  </defs>

  <!-- Archie -->
  <path fill="url(#body)" d="
    M239 746
    C239 522 409 344 627 344
    C845 344 1016 522 1016 746
    V1022
    Q1016 1036 1031 1043
    C1057 1057 1048 1101 1011 1101
    H797
    C769 1101 747 1078 747 1051
    V866
    C747 800 693 746 627 746
    C561 746 507 800 507 866
    V1051
    C507 1078 485 1101 457 1101
    H244
    C207 1101 198 1057 224 1043
    Q239 1036 239 1022Z"/>

  <!-- Hands -->
  <g fill="#008eff">
    <circle cx="220" cy="918" r="80"/>
    <circle cx="1034" cy="918" r="80"/>
  </g>

  <!-- Glasses -->
  <path d="M573 613Q626 575 675 613"
        fill="none" stroke="#081747"
        stroke-width="29" stroke-linecap="round"/>

  <g fill="#fff" stroke="#081747" stroke-width="33">
    <ellipse cx="473" cy="616" rx="101" ry="99"/>
    <ellipse cx="773" cy="616" rx="101" ry="99"/>
  </g>

  <!-- Solid black eyes -->
  <g fill="#000">
    <ellipse cx="487" cy="627" rx="37" ry="40"/>
    <ellipse cx="759" cy="625" rx="37" ry="40"/>
  </g>

  <!-- Hard hat: symmetrical around Archie's center -->
  <g stroke="#081747" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Helmet shell -->
    <path d="
      M382 407
      V392
      C382 267 489 169 627 169
      C765 169 872 267 872 392
      V407Z"
      fill="#ffda36"/>

    <!-- Side ribs -->
    <path d="M463 394C463 321 479 263 503 219
             M791 394C791 321 775 263 751 219"
          fill="none"/>

    <!-- Raised central ridge -->
    <path d="
      M567 395
      C567 303 572 227 581 171
      Q584 153 601 153
      H653
      Q670 153 673 171
      C682 227 687 303 687 395Z"
      fill="#ffe363"/>

    <!-- Brim follows the head's crown -->
    <path d="
      M371 399
      C440 377 531 365 627 365
      C723 365 814 377 883 399
      C900 405 908 420 902 434
      C896 448 882 451 866 446
      C799 425 716 414 627 414
      C538 414 455 425 388 446
      C372 451 358 448 352 434
      C346 420 354 405 371 399Z"
      fill="#ffda36"/>
  </g>
</svg>
